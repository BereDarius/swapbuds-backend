version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    assignees:
      - 'BereDarius'
    pull-request-branch-name:
      separator: '/'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'
